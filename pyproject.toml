[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "0.1.0"
description = "Mini-SIEM for Linux authentication logs: brute force, password spraying, off-hours and suspicious-success detection with exportable incident reports."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Leonard Opasanjo"}]
keywords = ["security", "siem", "ssh", "auth.log", "brute-force", "incident-response", "blue-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = ["pandas>=2.1", "streamlit>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
logsentinel = "logsentinel.cli:main"

[project.urls]
Homepage = "https://github.com/Leonard-Opasanjo/logsentinel"
Issues = "https://github.com/Leonard-Opasanjo/logsentinel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logsentinel = ["data/*.log"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # log-line fixtures are long by nature
