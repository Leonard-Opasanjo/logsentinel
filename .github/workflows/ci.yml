name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -U pip setuptools && pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Static security scan (bandit)
        run: bandit -q -c pyproject.toml -r src
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit
      - name: Sample log is reproducible
        run: python scripts/make_sample_log.py /tmp/sample.log && cmp /tmp/sample.log src/logsentinel/data/sample_auth.log

  # The SecureFlow pipeline from the sibling project: Bandit, Semgrep, Gitleaks and pip-audit,
  # merged into one report, published to code scanning, gated at high.
  security:
    uses: Leonard-Opasanjo/secureflow-devsecops/.github/workflows/secureflow.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      fail-on: high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t logsentinel .
      - run: docker run --rm logsentinel logsentinel analyze /usr/local/lib/python3.12/site-packages/logsentinel/data/sample_auth.log
